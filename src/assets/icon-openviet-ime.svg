<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" width="128" height="128" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Keycap bezel & body gradient -->
    <linearGradient id="keyBevel" x1="24.2" y1="30" x2="24.2" y2="101" gradientTransform="matrix(1.073,0,0,0.932,-0.23,0.29)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Keycap top surface gradient -->
    <linearGradient id="keySurface" x1="25.1" y1="33.4" x2="89.8" y2="98" gradientTransform="matrix(1.114,0,0,0.898,-0.23,0.29)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow & accent gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- V letter custom gradient (cyan to white gradient matching user design) -->
    <linearGradient id="vLetterGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- LED glow filter -->
    <filter id="glowFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Outer squircle badge with padding to guarantee 100% smooth antialiasing without clipping -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="27" fill="none" stroke="url(#accentGlow)" stroke-width="2" opacity="0.45" />

  <!-- Keycap Group -->
  <g transform="matrix(1.42,0,0,1.448,-26.88,-27.776)">
    <!-- Keycap pedestal shadow -->
    <rect x="25.77" y="32.29" width="76" height="66" rx="16" fill="#090d16" opacity="0.8" />
    <!-- Keycap bezel -->
    <rect x="25.77" y="28.29" width="76" height="66" rx="16" fill="url(#keyBevel)" />
    <!-- Keycap surface -->
    <rect x="27.77" y="30.29" width="72" height="58" rx="14" fill="url(#keySurface)" />
    <!-- Keycap inner accent border -->
    <rect x="28.77" y="31.29" width="70" height="56" rx="13" fill="none" stroke="url(#accentGlow)" stroke-width="1.5" opacity="0.75" />

    <!-- Tech Accent LED light -->
    <g transform="translate(-0.83,-1.71)">
      <circle cx="84" cy="42" r="3.5" fill="#38bdf8" filter="url(#glowFilter)" />
      <circle cx="84" cy="42" r="2" fill="#e0f2fe" />
    </g>

    <!-- Typing prompt cursor bar -->
    <rect x="46.15" y="78.67" width="40.15" height="3" rx="1.5" fill="url(#cursorGrad)" opacity="0.9" />

    <!-- Typography: V & N in pure vector paths -->
    <path
      d="M 54.796745,73.829384 65.728495,42.330387 H 61.450854 L 52.722737,68.990032 43.476118,42.330387 h -4.32085 l 11.320627,31.498997 z"
      fill="url(#vLetterGrad)"
      transform="scale(1.009811,0.99028432)" />
    <path
      d="M 90.852674,42.990635 H 87.050326 V 68.742901 L 70.587888,42.990635 h -4.364059 v 31.498997 h 3.802348 V 48.953408 l 16.289605,25.536224 h 4.536892 z"
      fill="#ffffff"
      transform="scale(1.009811,0.99028432)" />
  </g>
</svg>
